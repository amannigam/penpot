# Penpotter image pipeline.
#
# Upstream's build-docker.yml is unusable in a fork: it needs Penpot's
# self-hosted runners, their S3 bucket and their Docker Hub org. This workflow
# does the same two steps on stock GitHub runners and publishes to GHCR:
#
#   1. build the Penpot bundles inside the penpotapp/devenv image
#   2. build one Docker image per component from those bundles and push
#
# Tags produced:
#   push to `penpotter`  -> :dev  and :sha-<short>
#   push of tag v*       -> :release, :<tag> and :sha-<short>

name: Penpotter Images

on:
  push:
    branches: [penpotter]
    tags: ['v*']
    # The images are built from the Penpot source trees. Our deployment
    # overlay and the desktop shell never end up inside them, so changing
    # those should not burn a 20-minute rebuild.
    paths-ignore:
      - 'penpotter/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms'
        type: choice
        default: 'linux/amd64'
        options: ['linux/amd64', 'linux/amd64,linux/arm64', 'linux/arm64']
      build_wasm:
        description: 'Build the WASM render engine'
        type: boolean
        default: true

concurrency:
  group: penpotter-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/penpotter-
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  bundle:
    name: Build bundles
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Reclaim runner disk
        # The devenv image plus the CLJS/WASM build easily exceed the ~14GB a
        # stock runner leaves free. These preinstalled SDKs are dead weight here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # manage.sh derives the version from `git describe`

      # Authenticated pulls avoid Docker Hub's anonymous rate limit. Non-fatal:
      # the bundle build still works unauthenticated, just rate-limited.
      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build bundles
        env:
          BUILD_WASM: ${{ (inputs.build_wasm == false) && 'no' || 'yes' }}
          BUILD_STORYBOOK: 'no'   # not shipped in the penpotter stack
        run: ./manage.sh build-bundle

      - name: Package bundles
        run: tar -C bundles -czf bundles.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: penpot-bundles
          path: bundles.tar.gz
          retention-days: 3

  images:
    name: Image ${{ matrix.image }}
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, backend, exporter, mcp]
    steps:
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: penpot-bundles

      - name: Stage this image's bundle into the build context
        run: |
          mkdir -p bundles
          tar -C bundles -xzf bundles.tar.gz
          mv "bundles/${{ matrix.image }}" "docker/images/bundle-${{ matrix.image }}"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Penpot's Dockerfiles build FROM dhi.io (Docker Hardened Images). DHI is
      # free but the registry still requires an authenticated pull, using the
      # same Docker Hub credentials.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}${{ matrix.image }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/penpotter' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker/images/
          file: ./docker/images/Dockerfile.${{ matrix.image }}
          build-args: BUNDLE_PATH=./bundle-${{ matrix.image }}/
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The backend is not AOT-compiled: `require` runs when the container boots,
  # so a missing symbol builds a perfectly good image that crash-loops on
  # deploy. Booting the real image against throwaway infra is the only thing
  # that catches it. Enabling the GitHub provider with dummy credentials is
  # deliberate -- it forces the OIDC namespace to load.
  smoke:
    name: Smoke test backend image
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: penpot
          POSTGRES_USER: penpot
          POSTGRES_PASSWORD: penpot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U penpot"
          --health-interval 2s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8.1
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 20

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the backend
        run: |
          TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "Booting ${IMAGE_PREFIX}backend:${TAG}"
          docker run -d --name penpot-smoke --network host \
            -e PENPOT_HTTP_SERVER_PORT=6060 \
            -e PENPOT_DATABASE_URI=postgresql://localhost:5432/penpot \
            -e PENPOT_DATABASE_USERNAME=penpot \
            -e PENPOT_DATABASE_PASSWORD=penpot \
            -e PENPOT_REDIS_URI=redis://localhost:6379/0 \
            -e PENPOT_SECRET_KEY=smoke-test-only-not-a-real-key \
            -e PENPOT_FLAGS="enable-login-with-github disable-telemetry disable-secure-session-cookies" \
            -e PENPOT_GITHUB_CLIENT_ID=smoke-test \
            -e PENPOT_GITHUB_CLIENT_SECRET=smoke-test \
            "${IMAGE_PREFIX}backend:${TAG}"

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:6060/readyz || echo 000)
            if [ "$code" = "200" ]; then echo "ready after $((i*5))s"; exit 0; fi
            # Fail fast if the container gave up rather than waiting out the loop.
            if [ "$(docker inspect -f '{{.State.Running}}' penpot-smoke)" != "true" ]; then
              echo "::error::backend exited during startup"
              docker logs penpot-smoke 2>&1 | tail -60
              exit 1
            fi
            sleep 5
          done
          echo "::error::backend never became ready"
          docker logs penpot-smoke 2>&1 | tail -60
          exit 1

      - name: Confirm the GitHub provider initialised
        run: |
          if docker logs penpot-smoke 2>&1 | grep -q 'provider initialized.*github'; then
            echo "github provider loaded"
          else
            echo "::error::github provider did not initialise"
            docker logs penpot-smoke 2>&1 | grep -iE 'oidc|github|error' | tail -30
            exit 1
          fi
