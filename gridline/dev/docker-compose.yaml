## Gridline — LOCAL DEV STACK (Mac / arm64)
##
## This runs a release-shaped Penpot on your laptop. It is NOT the hot-reload
## coding environment (that is `./manage.sh run-devenv`, see gridline/README.md).
## Use this to smoke-test the images our CI will ship to the homelab.
##
##   docker compose -p gridline-dev --env-file .env -f docker-compose.yaml up -d
##   open http://localhost:9101
##
## IMAGE_PREFIX/PENPOT_VERSION let you flip between upstream images and ours:
##   upstream : IMAGE_PREFIX=penpotapp/          PENPOT_VERSION=2.17
##   ours     : IMAGE_PREFIX=ghcr.io/OWNER/gridline-  PENPOT_VERSION=dev

x-flags: &penpot-flags
  # Dev: registration open, no email verification, plain http so secure cookies off.
  PENPOT_FLAGS: >-
    enable-registration
    disable-email-verification
    enable-smtp
    enable-prepl-server
    disable-secure-session-cookies
    enable-mcp
    enable-webhooks
    enable-access-tokens
    enable-auto-file-snapshot
    disable-telemetry

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:9101}

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY in .env}

networks:
  gridline-dev:

volumes:
  gridline_dev_postgres:
  gridline_dev_assets:

services:
  penpot-frontend:
    image: "${IMAGE_PREFIX:-penpotapp/}frontend:${PENPOT_VERSION:-2.17}"
    # Our images are built linux/amd64 for the home lab; this Mac is
    # arm64, so they run here under Colima's Rosetta emulation.
    platform: ${GRIDLINE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    ports:
      - "${PENPOT_HTTP_PORT:-9101}:8080"
    volumes:
      - gridline_dev_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
    networks: [gridline-dev]
    environment:
      <<: [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]

  penpot-backend:
    image: "${IMAGE_PREFIX:-penpotapp/}backend:${PENPOT_VERSION:-2.17}"
    # Our images are built linux/amd64 for the home lab; this Mac is
    # arm64, so they run here under Colima's Rosetta emulation.
    platform: ${GRIDLINE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - gridline_dev_assets:/opt/data/assets
    depends_on:
      penpot-postgres: {condition: service_healthy}
      penpot-valkey: {condition: service_healthy}
    networks: [gridline-dev]
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key]
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot
      # Upstream default is 60 eagerly-opened connections; 20 is plenty locally.
      PENPOT_DATABASE_MAX_POOL_SIZE: 20
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      # Dev mail goes to mailcatcher on http://localhost:9180
      PENPOT_SMTP_DEFAULT_FROM: no-reply@gridline.local
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@gridline.local
      PENPOT_SMTP_HOST: penpot-mailcatch
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"

  penpot-exporter:
    image: "${IMAGE_PREFIX:-penpotapp/}exporter:${PENPOT_VERSION:-2.17}"
    # Our images are built linux/amd64 for the home lab; this Mac is
    # arm64, so they run here under Colima's Rosetta emulation.
    platform: ${GRIDLINE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      penpot-valkey: {condition: service_healthy}
    networks: [gridline-dev]
    environment:
      <<: [*penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-mcp:
    image: "${IMAGE_PREFIX:-penpotapp/}mcp:${PENPOT_VERSION:-2.17}"
    # Our images are built linux/amd64 for the home lab; this Mac is
    # arm64, so they run here under Colima's Rosetta emulation.
    platform: ${GRIDLINE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    networks: [gridline-dev]

  penpot-postgres:
    image: "postgres:15"
    restart: unless-stopped
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - gridline_dev_postgres:/var/lib/postgresql/data
    networks: [gridline-dev]
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: penpot

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks: [gridline-dev]
    environment:
      # Per Penpot's recommended settings: RAM-only, evict expired LFU keys.
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu

  penpot-mailcatch:
    image: sj26/mailcatcher:latest
    restart: unless-stopped
    expose: ['1025']
    ports:
      - "${PENPOT_MAILCATCH_PORT:-9180}:1080"
    networks: [gridline-dev]
